<!DOCTYPE html>
<html>

<head>
    <title>Facebook Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="left">
            <h1>facebook</h1>

            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>
        </div>


        <div class="right">

            <div class="login-box">

                <input type="text" placeholder="Email address or phone number" required>

                <input type="password" placeholder="Password" required>

                <button class="login">
                    Log In
                </button>

                <a href="#">
                    Forgotten password?
                </a>

                <hr>

                <button class="create">
                    Create new account
                </button>

            </div>

            <p class="page">
                <b>Create a Page</b> for a celebrity,
                brand or business.
            </p>

        </div>

    </div>


    <footer>

        <p>
            English (UK) &nbsp;
            اردو &nbsp;
        </p>

        <hr>

        <p>
            Sign Up &nbsp;
            Log In &nbsp;
            Messenger &nbsp;
            Facebook Lite &nbsp;
            Video &nbsp;
            Places &nbsp;
            Games &nbsp;
            Marketplace
        </p>

        <p>
            Meta © 2026
        </p>

    </footer>

</body>

</html>
